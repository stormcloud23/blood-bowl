name: Browser rules tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify generated documentation and browser bundle
        run: |
          npm run docs
          npm run build
          git diff --exit-code -- index.html docs/SKILLS.md docs/ROSTERS.md
      - name: Run rules and inline browser UI scenarios
        run: npm test
